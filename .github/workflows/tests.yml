# Builds the solution, runs the unit tests (tests/Krupno.Core.Tests), checks the installer script and runs the synthetic CLI
# tests (tests/run_cli_tests.ps1).
# The UI scripts (tests/gui_*.ps1) are not run here: they need a desktop and real models.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  cli:
    name: Build and CLI tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test dependencies
        run: python -m pip install numpy Pillow

      - name: Build
        run: dotnet build Krupno.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/Krupno.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

      # The installer is only built for a release; compiling its script here without output (/O-) catches a broken
      # language or message before then. The same Inno Setup version as in release.yml.
      - name: Installer script
        run: |
          choco install innosetup --version 6.7.1 -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /O- /DAppVersion=0.0.0 "/DAppDir=$PWD\src\Krupno.App\bin\Release\net10.0-windows\win-x64" installer\Krupno.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The runner has no GPU. DXGI reports "Microsoft Basic Render Driver" without the SOFTWARE flag, but Krupno drops it
      # by VendorId/DeviceId, so the list has only auto and cpu, and "-d auto" goes straight to the CPU.
      - name: Devices
        run: src\Krupno.Cli\bin\Release\net10.0-windows\win-x64\krupno-cli.exe --list-devices

      # -CheckFallback brings that adapter back (KRUPNO_BASIC_RENDER_DRIVER=1): "-d auto" picks it, DirectML fails to initialize on it,
      # and every "gpu" run must fall back to the CPU, which is how the fallback is tested.
      - name: CLI tests
        run: powershell -ExecutionPolicy Bypass -File tests\run_cli_tests.ps1 -CheckFallback

      - name: Failed run output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-tests-out
          path: tests/out/cli
          if-no-files-found: ignore
