# Builds the solution, runs the unit tests (tests/Krupno.Core.Tests), checks the installer script and runs the synthetic CLI
# tests (tests/run_cli_tests.ps1) on every push to main and every pull request, then squash-merges pull requests from this
# repository's branches once they pass.
# The UI scripts (tests/gui_*.ps1) are not run here: they need a desktop and real models.
name: Tests

on:
  push:
    # Other branches are tested through their pull requests: a push run of the same commit would be a second "Build and
    # CLI tests" check, which main requires, possibly still running when the pull request's run merges.
    branches: [main]
  pull_request:
    # ready_for_review: a draft marked ready is tested again and then merged.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  cli:
    name: Build and CLI tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test dependencies
        run: python -m pip install numpy Pillow

      - name: Build
        run: dotnet build Krupno.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/Krupno.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

      # The installer is only built for a release; compiling its script here without output (/O-) catches a broken
      # language or message before then, and so does any warning: a message missing from a translation would show in
      # English. The same Inno Setup version as in release.yml.
      - name: Installer script
        run: |
          choco install innosetup --version 6.7.1 -y --no-progress
          $output = & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /O- /DAppVersion=0.0.0 "/DAppDir=$PWD\src\Krupno.App\bin\Release\net10.0-windows10.0.19041.0\win-x64" installer\Krupno.iss 2>&1
          $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -match "^Warning:") { Write-Error "ISCC reported warnings"; exit 1 }

      # The runner has no GPU. DXGI reports "Microsoft Basic Render Driver" without the SOFTWARE flag, but Krupno drops it
      # by VendorId/DeviceId, so the list has only auto and cpu, and "-d auto" goes straight to the CPU.
      - name: Devices
        run: src\Krupno.Cli\bin\Release\net10.0-windows10.0.19041.0\win-x64\krupno-cli.exe --list-devices

      # -CheckFallback brings that adapter back (KRUPNO_BASIC_RENDER_DRIVER=1): "-d auto" picks it, DirectML fails to initialize on it,
      # and every "gpu" run must fall back to the CPU, which is how the fallback is tested.
      - name: CLI tests
        run: powershell -ExecutionPolicy Bypass -File tests\run_cli_tests.ps1 -CheckFallback

      - name: Failed run output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-tests-out
          path: tests/out/cli
          if-no-files-found: ignore

  # Merges here rather than through GitHub's auto-merge, which has to be turned on for each pull request. Left alone:
  # drafts, pull requests from forks, and Dependabot's updates, since an ONNX Runtime update can pass here on the CPU and
  # still break a GPU, which the runner doesn't have. The head commit must still be the one that was tested.
  merge:
    name: Merge
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge and delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --repo: no checkout here, so gh deletes only the branch on GitHub.
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"
